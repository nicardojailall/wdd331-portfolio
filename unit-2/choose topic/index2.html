<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS ::backdrop Demo</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-content">
        <h1>CSS <code>::backdrop</code> Example</h1>
        <p>Clicking the button opens a modal. The page content behind it will become frosted and blurred.</p>
        
        <!-- Button to launch the native dialog modal -->
        <button id="openBtn" class="btn primary-btn">Open Modal Dialog</button>
    </main>

    <!-- Native HTML Modal Dialog Element -->
    <dialog id="modalWindow">
        <h2>Modal Window</h2>
        <p>This is a native dialog box. Notice the darkened, blurred overlay behind it covering the viewport.</p>
        <button id="closeBtn" class="btn secondary-btn">Close Modal</button>
    </dialog>

    <!-- JavaScript to toggle the native modal -->
    <script>
        const modal = document.getElementById('modalWindow');
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');

        // showModal() is required to trigger the ::backdrop pseudo-element
        openBtn.addEventListener('click', () => modal.showModal());
        closeBtn.addEventListener('click', () => modal.close());
    </script>

</body>
</html>
