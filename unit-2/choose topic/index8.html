
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Queries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Container Query Demo</h1>

    <div class="container">
        <div class="card">
            <h2>Responsive Card</h2>
            <p>
                This card adjusts its font size and spacing
                based on the size of its container.
            </p>
            <button>Learn More</button>
        </div>
    </div>

    <div class="dark-container">
        <div class="card">
            <h2>Style Query Card</h2>
            <p>
                This card changes its appearance based on
                the container's style.
            </p>
        </div>
    </div>

</body>
</html>
