<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern CSS Layout Demo</title>
  <link rel="stylesheet" href="main7.css">
</head>
<body>

  <!-- Controls to swap layout flow instantly -->
    <!-- Fixed Layout Controls -->
  <header class="demo-controls">
    <button onclick="document.documentElement.setAttribute('dir', 'ltr')">Set Left-to-Right (LTR)</button>
    <button onclick="document.documentElement.setAttribute('dir', 'rtl')">Set Right-to-Left (RTL)</button>
  </header>


  <main class="gallery-layout">
    
    <!-- Profile Card (Intrinsic Sizing focus) -->
    <section class="card profile-card">
      <div class="image-wrapper">
        <img src="https://picsum.photos" alt="Profile avatar" class="responsive-media">
      </div>
      <div class="card-content">
        <!-- Fits perfectly to its exact word length without breaking -->
        <h2 class="badge-title">Expert_Dev</h2> 
        <p class="card-text">
          This card demonstrates modern layout encapsulation. Notice how the image retains its 1:1 aspect ratio perfectly without skewing.
        </p>
      </div>
    </section>

    <!-- Content Showcase Card (Logical properties & Aspect ratio focus) -->
    <article class="card visual-card">
      <div class="badge">New</div>
      <div class="hero-image-wrapper">
        <img src="https://picsum.photos" alt="Showcase background" class="responsive-media cover-fit">
      </div>
      <div class="card-content">
        <h2 class="card-title">Dynamic Architecture</h2>
        <p class="card-text">
          Toggle directions to see the image layout, structural borders, absolute badge positioning, and alignment flip effortlessly.
        </p>
      </div>
    </article>

  </main>

</body>
</html>
